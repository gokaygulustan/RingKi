name: Windows x86 build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: mingw-w64-i686-gcc make
      - name: Compile Win32 x86 EXE
        shell: msys2 {0}
        run: make clean all
      - name: Verify bundled audio
        run: python tests/verify_assets.py
      - name: Audit imported DLLs
        shell: pwsh
        run: ./scripts/audit-imports.ps1
      - name: Package portable app
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/RingKi/resources | Out-Null
          Copy-Item build/RingKi.exe dist/RingKi/
          Copy-Item resources/*.wav dist/RingKi/resources/
          Copy-Item README.md dist/RingKi/
          Copy-Item SOURCES.md, LICENSE dist/RingKi/
          Copy-Item LICENSES dist/RingKi/ -Recurse
          Compress-Archive -Path dist/RingKi/* -DestinationPath dist/RingKi-Windows-x86.zip -Force
          Get-FileHash dist/RingKi-Windows-x86.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  RingKi-Windows-x86.zip" } | Set-Content dist/RingKi-Windows-x86.zip.sha256
          Get-FileHash build/RingKi.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  RingKi.exe" } | Set-Content dist/RingKi.exe.sha256
      - name: Build per-user Windows installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS install failed" }
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer/ringki.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer build failed" }
          Get-FileHash dist/RingKi-Setup-Windows-x86.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  RingKi-Setup-Windows-x86.exe" } | Set-Content dist/RingKi-Setup-Windows-x86.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: RingKi-Windows-x86
          path: |
            build/RingKi.exe
            build/resources/*.wav
            dist/RingKi-Windows-x86.zip
            dist/RingKi-Windows-x86.zip.sha256
            dist/RingKi.exe.sha256
            dist/RingKi-Setup-Windows-x86.exe
            dist/RingKi-Setup-Windows-x86.exe.sha256
          if-no-files-found: ignore
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RingKi-Windows-x86.zip
            dist/RingKi-Windows-x86.zip.sha256
            build/RingKi.exe
            dist/RingKi.exe.sha256
            dist/RingKi-Setup-Windows-x86.exe
            dist/RingKi-Setup-Windows-x86.exe.sha256
